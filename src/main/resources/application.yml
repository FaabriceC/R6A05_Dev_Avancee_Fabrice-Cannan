server:
  port: 8080

spring:
  application:
    name: master-annonce

  datasource:
    url: jdbc:postgresql://localhost:5433/MasterAnnonce
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: my-super-secret-key-change-this-in-prod-very-long-123456789
    expiration-ms: 3600000

logging:
  level:
    root: INFO
    com.master.air: DEBUG
    org.springframework.security: INFO

  pattern:
    console: >
      %d{yyyy-MM-dd HH:mm:ss.SSS}
      [%thread]
      %-5level
      %logger{36}
      [corr=%X{correlationId}]
      - %msg%n